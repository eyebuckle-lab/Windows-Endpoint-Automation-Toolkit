# Windows PowerShell 5.1 CI
# Runs only on GitHub-hosted Windows machines. Never uploads real endpoint reports.
name: Windows PowerShell 5.1 CI

on:
  push:
    branches:
      - main
      - ci/windows-powershell-tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Six module tests and assessment
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Confirm Windows PowerShell 5.1
        run: |
          $version = $PSVersionTable.PSVersion
          Write-Host "Windows PowerShell version: $version"
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $version.Major -ne 5 -or $version.Minor -ne 1) {
              throw 'This project must be tested with Windows PowerShell 5.1.'
          }

      - name: Create ignored report directory
        run: |
          $reports = Join-Path $env:GITHUB_WORKSPACE 'reports'
          if (-not (Test-Path -LiteralPath $reports -PathType Container)) {
              New-Item -Path $reports -ItemType Directory -ErrorAction Stop | Out-Null
          }
          Write-Host 'Temporary reports directory ready (not uploaded).'

      - name: Parse all PowerShell scripts
        run: |
          $scripts = @(Get-ChildItem -Path . -Recurse -File -Filter '*.ps1' -ErrorAction Stop)
          if ($scripts.Count -eq 0) { throw 'No PowerShell scripts found.' }
          foreach ($script in $scripts) {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $script.FullName, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -gt 0) {
                  foreach ($issue in $parseErrors) {
                      Write-Host "Syntax issue in $($script.Name): $($issue.Message)"
                  }
                  throw "PowerShell parsing failed for $($script.FullName)."
              }
          }
          Write-Host "PowerShell syntax OK: $($scripts.Count) scripts."

      - name: Run all six module tests
        run: |
          & (Join-Path $PSHOME 'powershell.exe') -NoProfile -NonInteractive -File .\Run-ExtendedTests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "Six-module regression suite failed (exit code $LASTEXITCODE)."
          }

      - name: Run end-to-end assessment integration test
        run: |
          & (Join-Path $PSHOME 'powershell.exe') -NoProfile -NonInteractive -File .\tests\EndpointAssessment.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "Assessment integration test failed (exit code $LASTEXITCODE)."
          }

      - name: Verify real reports are untracked
        run: |
          $tracked = @(git ls-files -- 'reports/*' | Where-Object { $_ })
          if ($tracked.Count -gt 0) {
              throw "Private reports are tracked: $($tracked.Count) file(s)."
          }
          Write-Host 'PASS: No tracked reports; no report artifacts uploaded.'
